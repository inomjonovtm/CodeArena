upstream codearena_backend {
    server backend:8000;
}

upstream codearena_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Let's Encrypt tekshiruvi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPS'ga yo'naltirish (sertifikat o'rnatilgach izohdan chiqaring)
    # return 301 https://$host$request_uri;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://codearena_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://codearena_backend;
        access_log off;
    }

    location / {
        proxy_pass http://codearena_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

