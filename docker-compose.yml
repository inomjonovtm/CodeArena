name: codearena

services:
  # ------------------------------------------------------------ ma'lumotlar
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------- backend
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      RUNNER_URL: http://runner:2400
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py compile_locale &&
             python manage.py sync_roles &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    networks: [default, exec]
    expose:
      - "8000"

  celery:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      RUNNER_URL: http://runner:2400
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    depends_on:
      - backend
      - redis
    networks: [default, exec]
    command: celery -A config worker -l info --concurrency=4

  celery-beat:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A config beat -l info

  # ---------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    expose:
      - "3000"

  # --------------------------------------------- kod bajarish (izolyatsiya)
  # Ishonchsiz foydalanuvchi kodi FAQAT shu konteynerda bajariladi. Unda na
  # sayt kodi, na baza paroli, na maxfiy kalit bor. `exec` tarmog'i `internal`
  # bo'lgani uchun undan internetga ham, bazaga ham chiqib bo'lmaydi.
  runner:
    build: ./infra/runner
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-4}
    networks:
      - exec
    read_only: true
    tmpfs:
      # Kompilyatsiya va ijro shu yerda ketadi; `exec` — kompilyatsiya
      # natijasini ishga tushirish uchun zarur.
      - /tmp:rw,exec,size=512m,mode=1777
    cap_drop: [ALL]
    # `unshare` uchun kerak: har bir bajarilish o'z tarmoq/PID fazasida
    # ishlaydi. Bu `privileged` DAN ANCHA tor huquq.
    cap_add: [SYS_ADMIN]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${RUNNER_MEM_LIMIT:-2g}
    cpus: ${RUNNER_CPUS:-2}
    expose:
      - "2400"

  # ------------------------------------------------------------------ nginx
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    entrypoint: ["/bin/sh", "/docker-entrypoint-codearena.sh"]
    volumes:
      - ./infra/nginx/entrypoint.sh:/docker-entrypoint-codearena.sh:ro
      - ./infra/nginx/app.conf:/etc/nginx/app.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-false}
    entrypoint: ["/bin/sh", "/entrypoint-codearena.sh"]
    volumes:
      - ./infra/certbot/entrypoint.sh:/entrypoint-codearena.sh:ro
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  # Odatiy tarmoq: sayt, baza, kesh, nginx.
  default:
  # Kod bajarish tarmog'i — `internal: true`, ya'ni undan TASHQARIGA
  # (internetga) yo'l yo'q. Faqat backend/celery va runner shu tarmoqda;
  # postgres va redis bu yerda YO'Q, shuning uchun ishonchsiz kod bajarilgan
  # konteyner bazani umuman ko'rmaydi.
  exec:
    internal: true
