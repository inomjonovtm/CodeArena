# Saytning marshrutlari — HTTP va HTTPS server bloklarining IKKALASIGA ham
# `include` qilinadi (`entrypoint.sh` konfiguratsiyani shu fayl atrofida
# quradi). Marshrutlar bitta joyda tursin: ilgari HTTPS bloki qo'lda
# nusxalanardi va ikki blok bir-biridan farq qilib qolardi.
#
# MUHIM — `add_header` haqida: nginx'da ichki darajadagi bitta `add_header`
# yuqoridan meros bo'lgan BARCHA headerlarni bekor qiladi. Shuning uchun bu
# yerda `add_header` faqat nginx fayllarni o'zi bergan joylarda ishlatiladi
# (/static/, /media/) va u joylarda to'liq to'plam qayta yoziladi. Proksi
# qilingan javoblarning xavfsizlik headerlarini Django (SecurityMiddleware +
# apps.core.middleware.SecurityHeadersMiddleware) va Next.js o'zi qo'yadi —
# shu sababli ular bu yerda takrorlanmaydi.

location /static/ {
    alias /var/www/static/;
    access_log off;
    # Fayl nomlarida hash bor (ManifestStaticFilesStorage), shuning uchun
    # immutable xavfsiz: mazmun o'zgarsa nom ham o'zgaradi.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location /media/ {
    alias /var/www/media/;
    expires 7d;
    # Yuklangan fayl (SVG, HTML) sayt nomidan skript ishga tushira olmasin —
    # saqlangan XSS aynan shu yo'ldan keladi. `sandbox` va tor CSP buni
    # brauzer darajasida to'sadi.
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
}

# --- SSE (jonli natijalar va admin oqimi) --------------------------------
# Regex location prefiksli locationdan OLDIN tekshiriladi, shuning uchun bu
# blok `/api/` dan ustun turadi. Bufer o'chirilmasa nginx SSE hodisalarini
# to'plab turadi va jonli jadval sekundlab kechikadi; `proxy_read_timeout`
# ham uzun bo'lishi kerak, aks holda ochiq oqim 60 soniyada uziladi.
location ~ ^/api/(.+/)?stream/$ {
    proxy_pass http://codearena_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /api/ {
    proxy_pass http://codearena_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /health/ {
    proxy_pass http://codearena_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

location / {
    proxy_pass http://codearena_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
