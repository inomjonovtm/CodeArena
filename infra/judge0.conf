# Judge0 sozlamalari (12-bo'lim: xavfsizlik va resurs limitlari)
# To'liq ro'yxat: https://github.com/judge0/judge0/blob/master/judge0.conf

################################################################################
# Autentifikatsiya — backend `JUDGE0_TOKEN` bilan mos bo'lishi kerak
################################################################################
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=change-me-judge0-token

################################################################################
# Ma'lumotlar bazasi
################################################################################
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

################################################################################
# Redis
################################################################################
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0

################################################################################
# Resurs limitlari
################################################################################
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=30

MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=524288

STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=4096

ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

MAX_SUBMISSION_BATCH_SIZE=50
ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
