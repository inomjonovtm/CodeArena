name: CI

# Har push va PR da tekshiriladi. Deploy alohida workflow'da (deploy.yml) —
# u shu yerdagi ish nomlariga bog'liq, shuning uchun job nomlarini
# o'zgartirsangiz, deploy.yml dagi `needs` ni ham yangilang.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint alohida job: u sekundlarda tugaydi va xatoni butun test to'plami
  # ishlab bo'lguncha kutmasdan ko'rsatadi.
  lint-backend:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff o'rnatish
        run: pip install "ruff>=0.9,<1.0"

      - name: Lint
        working-directory: backend
        run: ruff check --output-format=github .

  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest

    # Migratsiyalar haqiqiy PostgreSQL'da tekshiriladi: SQLite ba'zi
    # cheklovlarni (masalan shartli UNIQUE indekslarni) boshqacha qo'llaydi,
    # shu sababli lokalda o'tgan migratsiya produksiyada uzilishi mumkin edi.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codearena
          POSTGRES_USER: codearena
          POSTGRES_PASSWORD: codearena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codearena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-key-not-used-in-production-000000000000
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: codearena
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: codearena
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_TASK_ALWAYS_EAGER: "True"
      # Produksiyada loglar aynan shu formatda chiqadi — formatlovchi
      # o'zi ham ishlashini shu yerda tekshirib qo'yamiz.
      LOG_FORMAT: json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bog'liqliklarni o'rnatish
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django tekshiruvi
        working-directory: backend
        run: python manage.py check --fail-level WARNING

      - name: Model va migratsiya mosligi
        working-directory: backend
        # Modelda o'zgarish bor-u, migratsiya yozilmagan bo'lsa — shu yerda tushadi.
        run: python manage.py makemigrations --check --dry-run

      - name: Migratsiyalarni toza bazaga qo'llash
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Testlar
        working-directory: backend
        # Bu qadam bo'lmasa CI faqat «kod importlanadimi» ni tekshirardi:
        # Elo hisobi, ruxsatlar va anti-plagiat jimgina buzilishi mumkin edi.
        # `--shuffle` testlar bir-biriga bog'lanib qolganini ochib beradi.
        run: python manage.py test --verbosity 2 --shuffle

      - name: Statik fayllarni yig'ish
        working-directory: backend
        run: python manage.py collectstatic --noinput

      - name: Produksiya sozlamalari tekshiruvi
        working-directory: backend
        # `--tag security` bo'lmasa drf-spectacular'ning yuzlab «serializer
        # topilmadi» ogohlantirishi chiqadi va haqiqiy xavfsizlik xabari
        # ular orasida ko'rinmay qoladi. DEBUG=False bo'lgani uchun sir va
        # baza paroli himoyalari ham shu qadamda sinaladi.
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-deploy-check-only-${{ github.sha }}-${{ github.run_id }}
          POSTGRES_PASSWORD: ci-non-default-password
        run: python manage.py check --deploy --tag security --fail-level WARNING

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bog'liqliklarni o'rnatish
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # Ilgari loyihada ESLint konfiguratsiyasi umuman yo'q edi va build
        # `ignoreDuringBuilds: true` bilan uni chetlab o'tardi.
        run: npm run lint

      - name: Tiplarni tekshirish
        working-directory: frontend
        run: npm run typecheck

      - name: Testlar
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        # Build paytida backendga so'rov yuborilmaydi (sitemap xatoni yutadi),
        # shuning uchun bu yerda haqiqiy API manzili kerak emas.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # Bog'liqliklardagi ma'lum zaifliklar. Bu job PR ni TO'XTATMAYDI: yangi
  # CVE har kuni chiqadi va u o'zgarish muallifining aybi emas. Lekin
  # natija Actions sahifasida ko'rinib turadi va e'tibordan chetda qolmaydi.
  audit:
    name: Bog'liqliklar auditi
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
